<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Story</title>

<style>

/* =========================
   基础
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Helvetica Neue","PingFang SC",sans-serif;
}

body{
    background:#f8f8f8;
    color:#222;
}


/* =========================
   首页
========================= */

.hero{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px 20px;
}

.hero h1{
    font-size:60px;
    letter-spacing:8px;
    font-weight:300;
}

.hero p{
    margin-top:20px;
    color:#777;
    font-size:18px;
}


/* =========================
   日期
========================= */

.days{
    margin-top:20px;
    font-size:32px;
    font-weight:500;
}


/* =========================
   模块
========================= */

.section{
    max-width:1000px;
    margin:auto;
    padding:60px 20px;
}

.title{
    font-size:36px;
    font-weight:300;
    margin-bottom:30px;
}


/* =========================
   时间轴
========================= */

.timeline{
    border-left:1px solid #ddd;
    padding-left:30px;
}

.item{
    margin-bottom:30px;
}

.item h3{
    font-size:22px;
}

.item p{
    margin-top:10px;
    color:#777;
}


/* =========================
   所有图片
========================= */

body > div[style*="text-align:center"] img{

    width:420px;
    height:420px;

    object-fit:contain;

    border-radius:12px;

    margin:5px;

    vertical-align:middle;
}


.hero img{

    width:420px;
    height:420px;

    object-fit:contain;

    border-radius:12px;

    margin:5px;
}


.item img{

    width:420px;
    height:420px;

    object-fit:contain;

    border-radius:12px;

    margin-top:10px;
}


/* =========================
   Memories
========================= */

.gallery{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:15px;

}


.gallery img{

    width:420px;
    height:420px;

    max-width:100%;

    object-fit:contain;

    border-radius:12px;

    filter:grayscale(20%);

    display:block;

    margin:auto;
}


/* =========================
   情书
========================= */

.letter{

    background:white;

    padding:40px;

    border-radius:20px;

    line-height:2;

    box-shadow:
    0 20px 50px rgba(0,0,0,.05);

}


.letter img{

    width:420px;
    height:420px;

    object-fit:contain;

    border-radius:12px;

    margin:5px;

}


/* =========================
   入场页面
========================= */

#welcomeScreen{

    position:fixed;

    inset:0;

    z-index:99999;

    background:
    linear-gradient(
        135deg,
        #fff5f7,
        #ffe8ee
    );

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    transition:
    opacity 1s ease,
    visibility 1s ease;
}


#welcomeScreen.hide{

    opacity:0;

    visibility:hidden;

}


.welcome-content{

    padding:30px;

}


.heart{

    font-size:60px;

    animation:
    heartbeat 1.4s infinite;

}


.welcome-content h1{

    font-size:36px;

    margin:20px 0 10px;

}


.welcome-content p{

    color:#888;

    margin-bottom:35px;

}


#enterBtn{

    border:none;

    padding:14px 32px;

    border-radius:30px;

    background:#222;

    color:white;

    font-size:16px;

    cursor:pointer;

    transition:0.3s;

}


#enterBtn:hover{

    transform:scale(1.05);

}


@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.15);
    }

}


/* =========================
   手机适配
========================= */

@media(max-width:700px){

    .hero h1{
        font-size:38px;
        letter-spacing:4px;
    }


    .hero p{
        font-size:16px;
    }


    .gallery{

        grid-template-columns:1fr;

    }


    body > div[style*="text-align:center"] img,
    .hero img,
    .item img,
    .gallery img,
    .letter img{

        width:100%;

        height:auto;

        max-width:420px;

    }


    .section{

        padding:45px 15px;

    }


    .title{

        font-size:30px;

        margin-bottom:25px;

    }


    .letter{

        padding:25px;

    }

}

</style>

</head>

<!-- =========================
     日期计算
========================= -->

<script>

let start =
new Date("2020-03-26");


let now =
new Date();


let diff =
Math.floor(
    (now - start) /
    (1000 * 60 * 60 * 24)
);


document.getElementById("days")
.innerHTML = diff;

</script>


<!-- =========================
     点击进入 + 音乐
========================= -->

<script>

const enterBtn =
document.getElementById("enterBtn");


const welcomeScreen =
document.getElementById("welcomeScreen");


const bgMusic =
document.getElementById("bgMusic");


enterBtn.addEventListener(
    "click",
    function(){

        bgMusic.play()
        .catch(function(error){

            console.log(
                "音乐播放失败：",
                error
            );

        });


        welcomeScreen.classList.add(
            "hide"
        );


        setTimeout(
            function(){

                welcomeScreen.style.display =
                "none";

            },
            1000
        );

    }
);

</script>
