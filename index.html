<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Story</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Microsoft YaHei",Arial,sans-serif;
    background:#fafafa;
    color:#333;
}

/* ==================== 欢迎页面 ==================== */

#welcomeScreen{
    position:fixed;
    inset:0;
    background:#fff;
    z-index:9999;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    transition:opacity 1s ease;
}

.welcome-content{
    padding:30px;
}

.welcome-logo{
    font-size:42px;
    letter-spacing:8px;
    margin-bottom:25px;
}

.welcome-title{
    font-size:42px;
    letter-spacing:8px;
    margin-bottom:20px;
}

.welcome-subtitle{
    font-size:16px;
    color:#888;
    margin-bottom:40px;
}

#enterBtn{
    padding:14px 32px;
    border:1px solid #333;
    background:#fff;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
    transition:all .3s;
}

#enterBtn:hover{
    background:#333;
    color:#fff;
}

#welcomeScreen.hide{
    opacity:0;
}

/* ==================== 通用 ==================== */

.section{
    max-width:1200px;
    margin:auto;
    padding:70px 30px;
}

.title{
    text-align:center;
    font-size:34px;
    letter-spacing:5px;
    margin-bottom:40px;
}

.subtitle{
    text-align:center;
    color:#999;
    margin-top:-25px;
    margin-bottom:40px;
}

/* ==================== 顶部回忆照片 ==================== */

body > div[style*="text-align:center"]{
    text-align:center;
}

body > div[style*="text-align:center"] img{
    width:420px;
    height:420px;
    object-fit:contain;
    border-radius:12px;
    margin:5px;
    vertical-align:middle;
}

/* ==================== 天数 ==================== */

.days{
    text-align:center;
    padding:70px 20px;
}

.days-number{
    font-size:70px;
    font-weight:bold;
    letter-spacing:3px;
}

.days-text{
    margin-top:10px;
    color:#888;
    font-size:16px;
}

/* ==================== Hero ==================== */

.hero{
    text-align:center;
    padding:80px 20px;
}

.hero h1{
    font-size:46px;
    letter-spacing:8px;
    margin-bottom:15px;
}

.hero p{
    color:#999;
    margin-bottom:40px;
}

.hero img{
    width:420px;
    height:420px;
    object-fit:contain;
    border-radius:12px;
    margin:5px;
}

/* ==================== 时间线 ==================== */

.timeline{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:30px;
    max-width:1000px;
    margin:auto;
}

.item{
    text-align:center;
    padding:25px;
    background:#fff;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.item h3{
    font-size:22px;
    margin-bottom:10px;
}

.item p{
    color:#999;
    margin-bottom:10px;
}

.item img{
    width:420px;
    height:420px;
    max-width:100%;
    object-fit:contain;
    border-radius:12px;
    margin-top:10px;
}

/* ==================== Memories ==================== */

.gallery{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.gallery img{
    width:420px;
    height:420px;
    max-width:100%;
    object-fit:contain;
    border-radius:12px;
    filter:grayscale(20%);
    display:block;
    margin:auto;
}

/* ==================== A Letter ==================== */

.letter{
    max-width:900px;
    margin:auto;
    background:#fff;
    padding:40px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.05);
    text-align:center;
}

.letter h3{
    font-size:28px;
    margin-bottom:25px;
}

.letter p{
    line-height:2;
    color:#666;
    margin-bottom:30px;
}

.letter video{
    width:420px;
    height:420px;
    max-width:100%;
    object-fit:contain;
    border-radius:12px;
    display:block;
    margin:10px auto;
    background:#000;
}

/* ==================== 分割线 ==================== */

.divider{
    width:50px;
    height:1px;
    background:#333;
    margin:60px auto;
}

/* ==================== 手机适配 ==================== */

@media(max-width:700px){

    .welcome-logo{
        font-size:30px;
        letter-spacing:5px;
    }

    .welcome-title{
        font-size:32px;
        letter-spacing:5px;
    }

    .hero h1{
        font-size:38px;
        letter-spacing:4px;
    }

    .hero p{
        font-size:16px;
    }

    .timeline{
        grid-template-columns:1fr;
    }

    .gallery{
        grid-template-columns:1fr;
    }

    body > div[style*="text-align:center"] img,
    .hero img,
    .item img,
    .gallery img,
    .letter video{
        width:100%;
        height:auto;
        max-width:420px;
    }

    .section{
        padding:45px 15px;
    }

    .title{
        font-size:30px;
        margin-bottom:25px;
    }

    .letter{
        padding:25px;
    }

    .days-number{
        font-size:55px;
    }
}
</style>
</head>

<body>

<!-- ==================== 欢迎页面 ==================== -->

<div id="welcomeScreen">
    <div class="welcome-content">

        <div class="welcome-logo">
            LYL❤️CYT
        </div>

        </div>

        <div class="welcome-subtitle">

        </div>

<!-- ==================== HERO ==================== -->

<div class="divider"></div>


<!-- ==================== 时间线 ==================== -->

<section class="section">

    <h2 class="title">

    </h2>

    <div class="timeline">

        <!-- 广州长隆 -->

        <div class="item">

    </div>

</section>


<div class="divider"></div>


<!-- ==================== Memories ==================== -->

<section class="section">

    <div class="gallery">

        <img src="微信图片_20260914183821_59_15.jpg" alt="回忆">

        <img src="微信图片_20260914183856_61_15.jpg" alt="回忆">

</section>


<div class="divider"></div>


<!-- ==================== A Letter ==================== -->

<section class="section">

    <h2 class="title">
        A Letter
    </h2>

    <div class="letter">

        <h3>
            To You ❤️
        </h3>

        <p>
            从2020年3月26日开始，
            我们一起经历了很多很多。
            <br>
            有开心，也有争吵；
            有见面，也有想念。
            <br>
            但不管时间怎么变化，
            我都很珍惜我们一起走过的每一天。
        </p>


        <!-- A Letter 只放视频 -->

        <video
            src="05ef83cd95570b5636907803f68ebebf.mp4"
            controls
            playsinline
            preload="metadata">
        </video>

    </div>

<!-- ==================== JS ==================== -->

<script>

const enterBtn = document.getElementById("enterBtn");

const welcomeScreen =
    document.getElementById("welcomeScreen");

const bgMusic =
    document.getElementById("bgMusic");


enterBtn.addEventListener("click", function(){

    bgMusic.play().catch(function(error){

        console.log("音乐播放失败：", error);

    });

    welcomeScreen.classList.add("hide");

    setTimeout(function(){

        welcomeScreen.style.display = "none";

    },1000);

});


/* ==================== 相爱天数 ==================== */

let start = new Date("2020-03-26");

let now = new Date();

let diff = Math.floor(
    (now - start) /
    (1000 * 60 * 60 * 24)
);

document.getElementById("days").innerHTML = diff;

</script>

</body>
</html>
