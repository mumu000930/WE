<!DOCTYPE html>

<title>Our Story</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Helvetica Neue","PingFang SC",sans-serif;
}

body{
    background:#f8f8f8;
    color:#222;
}


/* 首页 */

.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero h1{
    font-size:60px;
    letter-spacing:8px;
    font-weight:300;
}

.hero p{
    margin-top:30px;
    color:#777;
    font-size:18px;
}


/* 日期 */

.days{
    margin-top:40px;
    font-size:32px;
    font-weight:500;
}


/* 模块 */

.section{
    max-width:1000px;
    margin:auto;
    padding:100px 20px;
}


.title{
    font-size:36px;
    font-weight:300;
    margin-bottom:50px;
}


/* 时间轴 */

.timeline{
    border-left:1px solid #ddd;
    padding-left:40px;
}


.item{
    margin-bottom:50px;
}


.item h3{
    font-size:22px;
}


.item p{
    margin-top:10px;
    color:#777;
}


/* 图片 */

.gallery{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}


.gallery img{
    width:100%;
    height:300px;
    object-fit:cover;
    border-radius:12px;
    filter:grayscale(20%);
}


/* 情书 */

.letter{
    background:white;
    padding:50px;
    border-radius:20px;
    line-height:2;
    box-shadow:0 20px 50px rgba(0,0,0,.05);
}


/* 手机 */

@media(max-width:700px){

.hero h1{
    font-size:38px;
}


.gallery{
    grid-template-columns:1fr;
}

}

</style>

</head>
