<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Story</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Helvetica Neue","PingFang SC",sans-serif;
}

body{
    background:#f8f8f8;
    color:#222;
}


/* 首页 */

.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero h1{
    font-size:60px;
    letter-spacing:8px;
    font-weight:300;
}

.hero p{
    margin-top:30px;
    color:#777;
    font-size:18px;
}


/* 日期 */

.days{
    margin-top:40px;
    font-size:32px;
    font-weight:500;
}


/* 模块 */

.section{
    max-width:1000px;
    margin:auto;
    padding:100px 20px;
}


.title{
    font-size:36px;
    font-weight:300;
    margin-bottom:50px;
}


/* 时间轴 */

.timeline{
    border-left:1px solid #ddd;
    padding-left:40px;
}


.item{
    margin-bottom:50px;
}


.item h3{
    font-size:22px;
}


.item p{
    margin-top:10px;
    color:#777;
}


/* 图片 */

.gallery{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}


.gallery img{
    width:100%;
    height:300px;
    object-fit:cover;
    border-radius:12px;
    filter:grayscale(20%);
}


/* 情书 */

.letter{
    background:white;
    padding:50px;
    border-radius:20px;
    line-height:2;
    box-shadow:0 20px 50px rgba(0,0,0,.05);
}


/* 手机 */

@media(max-width:700px){

.hero h1{
    font-size:38px;
}

.gallery{
    grid-template-columns:1fr;
}

}


/* =========================
   入场页面
========================= */

#welcomeScreen{
    position:fixed;
    inset:0;
    z-index:99999;
    background:linear-gradient(135deg,#fff5f7,#ffe8ee);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    transition:opacity 1s ease,visibility 1s ease;
}

#welcomeScreen.hide{
    opacity:0;
    visibility:hidden;
}

.welcome-content{
    padding:30px;
}

.heart{
    font-size:60px;
    animation:heartbeat 1.4s infinite;
}

.welcome-content h1{
    font-size:36px;
    margin:20px 0 10px;
}

.welcome-content p{
    color:#888;
    margin-bottom:35px;
}

#enterBtn{
    border:none;
    padding:14px 32px;
    border-radius:30px;
    background:#222;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

#enterBtn:hover{
    transform:scale(1.05);
}

@keyframes heartbeat{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.15);
    }
}

</style>
</head>


<body>


<!-- =========================
     入场页面
========================= -->

<div id="welcomeScreen">

    <div class="welcome-content">

        <div class="heart">LYL❤️CYT</div>

        <p>有你的每一天，都值得被记录</p>

        <button id="enterBtn">

<!-- =========================
     日期计算
========================= -->

<script>

let start =
new Date("2020-03-26");

let now =
new Date();

let diff =
Math.floor(
(now-start)/(1000*60*60*24)
);

document.getElementById("days")
.innerHTML=diff;

</script>


<!-- =========================
     点击进入 + 音乐
========================= -->

<script>

const enterBtn =
document.getElementById("enterBtn");

const welcomeScreen =
document.getElementById("welcomeScreen");

const bgMusic =
document.getElementById("bgMusic");


enterBtn.addEventListener("click",function(){

    bgMusic.play().catch(function(error){

        console.log("音乐播放失败：",error);

    });


    welcomeScreen.classList.add("hide");


    setTimeout(function(){

        welcomeScreen.style.display="none";

    },1000);

});

</script>

</html>
