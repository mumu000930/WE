<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Story</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:
        "Microsoft YaHei",
        "PingFang SC",
        Arial,
        sans-serif;
    background:#f7f4f1;
    color:#333;
}

/* =========================
   欢迎页面
========================= */

#welcomeScreen{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        linear-gradient(
            rgba(255,255,255,0.90),
            rgba(255,255,255,0.90)
        );

    z-index:9999;

    transition:opacity 1s ease;
}

.welcome-content{
    text-align:center;
    padding:30px;
}

.welcome-content h1{
    font-size:42px;
    letter-spacing:5px;
    margin-bottom:20px;
}

.welcome-content h2{
    font-size:26px;
    font-weight:400;
    margin-bottom:15px;
}

.welcome-content p{
    color:#777;
    font-size:16px;
    margin-bottom:30px;
}

#enterBtn{
    border:none;
    padding:14px 32px;

    background:#333;
    color:white;

    border-radius:30px;

    font-size:16px;
    cursor:pointer;

    transition:all .3s ease;
}

#enterBtn:hover{
    transform:translateY(-2px);
    opacity:.85;
}

#welcomeScreen.hide{
    opacity:0;
}

/* =========================
   主体
========================= */

.container{
    width:90%;
    max-width:1100px;
    margin:auto;
}

/* =========================
   顶部标题
========================= */

header{
    text-align:center;
    padding:80px 20px 50px;
}

header h1{
    font-size:38px;
    font-weight:500;
    letter-spacing:4px;
}

header p{
    margin-top:15px;
    color:#888;
}

/* =========================
   Section
========================= */

.section{
    margin-bottom:80px;
}

.section-title{
    text-align:center;
    font-size:28px;
    font-weight:500;
    margin-bottom:40px;
}

.section-title::after{
    content:"";
    display:block;

    width:50px;
    height:2px;

    background:#333;

    margin:15px auto 0;
}

/* =========================
   顶部照片
========================= */

.top-gallery{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.top-gallery img{
    width:100%;
    height:420px;

    object-fit:contain;

    background:#fff;

    border-radius:12px;

    display:block;
}

/* =========================
   Hero
========================= */

.hero{
    text-align:center;
    padding:20px 0;
}

.hero h2{
    font-size:30px;
    font-weight:400;
    margin-bottom:10px;
}

.hero p{
    color:#999;
    margin-bottom:30px;
}

.hero-images{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.hero-images img{
    width:100%;
    height:420px;

    object-fit:contain;

    background:#fff;

    border-radius:12px;
}

/* =========================
   天数
========================= */

.days-box{
    text-align:center;
    margin:60px 0;
}

.days{
    font-size:64px;
    font-weight:500;
    letter-spacing:3px;
}

.days-text{
    margin-top:10px;
    color:#888;
    font-size:16px;
}

/* =========================
   时间线
========================= */

.timeline{
    display:grid;
    grid-template-columns:repeat(2,1fr);

    gap:30px;

    border-left:none;

    padding-left:0;
}

.timeline-item{
    background:#fff;

    padding:25px;

    border-radius:18px;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.05);
}

.timeline-item h3{
    font-size:22px;
    font-weight:500;

    margin-bottom:8px;
}

.timeline-item p{
    color:#999;

    margin-bottom:20px;
}

.timeline-item img{
    width:100%;
    height:420px;

    object-fit:contain;

    background:#f7f7f7;

    border-radius:12px;
}

/* =========================
   回忆
========================= */

.gallery{
    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:20px;
}

.gallery img{
    width:100%;
    height:420px;

    object-fit:contain;

    background:#fff;

    border-radius:12px;

    display:block;

    transition:
        transform .3s ease,
        box-shadow .3s ease;
}

.gallery img:hover{
    transform:translateY(-4px);

    box-shadow:
        0 10px 30px rgba(0,0,0,0.10);
}

/* =========================
   情书
========================= */

.letter{
    background:#fff;

    padding:40px;

    border-radius:20px;

    line-height:2;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.05);

    text-align:center;
}

.letter p{
    margin-bottom:10px;
}

.letter video{
    width:420px;
    height:420px;

    max-width:100%;

    object-fit:contain;

    border-radius:12px;

    display:block;

    margin:20px auto;

    background:#000;
}

/* =========================
   底部
========================= */

footer{
    text-align:center;

    padding:50px 20px 70px;

    color:#999;

    font-size:14px;
}

/* =========================
   手机端
========================= */

@media(max-width:700px){

    .container{
        width:92%;
    }

    header{
        padding:60px 15px 40px;
    }

    header h1{
        font-size:30px;
    }

    .section{
        margin-bottom:60px;
    }

    .section-title{
        font-size:25px;
    }

    .top-gallery{
        grid-template-columns:1fr;
    }

    .top-gallery img{
        width:100%;
        height:auto;
        max-width:420px;
        margin:auto;
    }

    .hero-images{
        grid-template-columns:1fr;
    }

    .hero-images img{
        width:100%;
        height:auto;
        max-width:420px;
        margin:auto;
    }

    .timeline{
        grid-template-columns:1fr;
    }

    .timeline-item img{
        width:100%;
        height:auto;
        max-width:420px;
        margin:auto;
    }

    .gallery{
        grid-template-columns:1fr;
    }

    .gallery img{
        width:100%;
        height:auto;
        max-width:420px;
        margin:auto;
    }

    .days{
        font-size:48px;
    }

    .letter{
        padding:25px 18px;
    }

    .letter video{
        width:100%;
        height:auto;
        max-width:420px;
    }

    .welcome-content h1{
        font-size:32px;
    }

    .welcome-content h2{
        font-size:22px;
    }

}

/* =========================
   小屏幕
========================= */

@media(max-width:400px){

    .days{
        font-size:42px;
    }

    .welcome-content h1{
        font-size:28px;
    }

}

</style>

</head>

<!-- =========================
     JavaScript
========================= -->

<script>


/* =========================
   点击进入 + 播放音乐
========================= */

const enterBtn =
    document.getElementById("enterBtn");

const welcomeScreen =
    document.getElementById("welcomeScreen");

const bgMusic =
    document.getElementById("bgMusic");


enterBtn.addEventListener(
    "click",
    function(){

        bgMusic
            .play()
            .catch(function(error){

                console.log(
                    "音乐播放失败：",
                    error
                );

            });


        welcomeScreen.classList.add("hide");


        setTimeout(
            function(){

                welcomeScreen.style.display =
                    "none";

            },
            1000
        );

    }
);



/* =========================
   恋爱天数
========================= */

let start =
    new Date("2020-03-26");

let now =
    new Date();


let diff =
    Math.floor(
        (
            now - start
        )
        /
        (
            1000 *
            60 *
            60 *
            24
        )
    );


document.getElementById("days")
    .innerHTML = diff;


</script>
